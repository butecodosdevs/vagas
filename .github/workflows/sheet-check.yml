name: Checagem da planilha

# O secret não pode ir para um job de pull_request: esse evento executa o
# código do PR (workflow, requirements e script). pull_request_target usa o
# workflow da branch padrão e o checkout abaixo fica no commit base, nunca
# no head do PR. Fork continua de fora.
on:
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sheet-connectivity:
    name: Checagem da planilha
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Ler a linha 1 das abas
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID || '1mMjsxHBRritkBUIEz4-TsNLBofVC7crG8WNrSwtegsQ' }}
        run: python scripts/check_sheet.py
