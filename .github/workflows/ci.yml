name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testes do gerador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Rodar testes
        run: |
          python -m pytest
          node --test tests/apps_script.test.mjs

  gerar:
    name: Gerar site com Roq
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Gerar o site
        run: ./mvnw -B package quarkus:run -DskipTests
        env:
          QUARKUS_ROQ_GENERATOR_BATCH: "true"
      - name: Gerar de novo sem vagas nem candidatos
        run: python3 scripts/check_empty_collections.py

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Gerar o site
        run: ./mvnw -B package quarkus:run -DskipTests
        env:
          QUARKUS_ROQ_GENERATOR_BATCH: "true"
      - name: Instalar o Playwright
        working-directory: e2e
        run: npm ci
      - name: Instalar o Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Rodar o e2e
        working-directory: e2e
        run: npm test
