name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testes do gerador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Rodar testes
        run: python -m pytest

  gerar:
    name: Gerar site com Roq
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Instalar o Roq
        run: |
          curl -Ls https://sh.jbang.dev | bash -s - app install --fresh --force roq@quarkiverse/quarkus-roq
          echo "$HOME/.jbang/bin" >> "$GITHUB_PATH"
      - name: Gerar o site
        run: roq generate

  sheet-connectivity:
    name: Checagem da planilha
    # Fork não recebe secret. PR do próprio repositório e disparo manual recebem.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Ler a linha 1 das abas
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID || '1mMjsxHBRritkBUIEz4-TsNLBofVC7crG8WNrSwtegsQ' }}
        run: python scripts/check_sheet.py
