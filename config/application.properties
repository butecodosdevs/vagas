quarkus.qute.alt-expr-syntax=true

# Origem do site. O caminho /vagas é o root-path do GitHub Pages do repositório.
# O workflow de deploy sobrescreve os dois com a URL configurada em Settings > Pages.
site.url=https://butecodosdevs.github.io
site.default-locale=pt-BR
quarkus.http.root-path=/vagas

%dev.site.url=http://localhost:8080
%dev.quarkus.http.root-path=/

# O .gitkeep segura a pasta no git quando o sync apaga todos os Markdown.
site.ignored-files=**/.gitkeep

# Coleções geradas a partir da planilha. posts fica desligada: este site não é um blog.
site.collections.posts=false
site.collections.vagas=true
site.collections.vagas.layout=vaga
site.collections.candidatos=true
site.collections.candidatos.layout=candidato

# A URL do Apps Script fica em data/forms.yaml (scriptUrl).
